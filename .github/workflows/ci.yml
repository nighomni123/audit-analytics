name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.12.16
      - name: Verify lock and install
        run: |
          uv lock --check
          uv sync --frozen --all-extras --group dev
      - name: Compile and test
        run: |
          uv run python -m compileall -q src run.py
          uv run pytest -q
      - name: Audit Python dependencies
        run: uv run pip-audit --local
      - name: Check Python license metadata
        run: uv run pip-licenses --from=mixed --format=json --with-urls --fail-on='AGPL;GPL;SSPL' > /tmp/python-licenses.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, audit, typecheck, and build
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Verify committed static artifact is reproducible
        run: git diff --exit-code -- src/audit_analytics/static

  browser:
    name: Browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked environments
        run: |
          python -m pip install uv==0.12.16
          uv sync --frozen --all-extras --group dev
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Install Chromium and run workflow
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  policy:
    name: Repository and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Enforce repository and frontend license policy
        run: |
          python scripts/check_repo.py
          python scripts/check_licenses.py
      - name: Scan tracked content and history for secrets
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.24.3 detect --source=/repo --no-banner --redact --exit-code=1
