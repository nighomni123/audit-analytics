name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked build and supply-chain tools
        run: |
          python -m pip install uv==0.12.16
          uv sync --frozen --all-extras --group dev
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Build and verify Python package
        run: |
          rm -rf dist reports
          uv build
          uv run twine check dist/*
          git diff --exit-code -- src/audit_analytics/static
          python -m venv /tmp/release-venv
          wheel=$(find dist -name '*.whl' -print -quit)
          /tmp/release-venv/bin/pip install "${wheel}[web]"
          /tmp/release-venv/bin/python - <<'PY'
          from audit_analytics.api.app import create_app
          from pathlib import Path
          app = create_app('/tmp/release-smoke.db')
          assert (Path(app.state.static_dir) / 'index.html').is_file()
          print('Installed wheel contains the canonical static UI.')
          PY
      - name: Generate SBOMs and license inventories
        run: |
          mkdir -p reports
          uv run cyclonedx-py environment --of JSON -o reports/python-sbom.json --output-reproducible
          uv run pip-licenses --from=mixed --format=json --with-urls --fail-on='AGPL;GPL;SSPL' > reports/python-licenses.json
          npm --prefix frontend sbom --sbom-format cyclonedx > reports/frontend-sbom.json
          npm --prefix frontend query ":root > *" --json > reports/frontend-licenses.json
      - name: Generate release checksums
        run: sha256sum dist/* reports/* > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-analytics-release
          path: |
            dist/
            reports/
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        run: gh release create "${{ inputs.tag || github.ref_name }}" dist/* reports/* SHA256SUMS.txt --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
