[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-analytics"
version = "1.0.0"
description = "Local-first, explainable journal-entry analytics for statutory-audit review"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "nighomni123" }]
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
audit-analytics = "audit_analytics.cli:main"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "cyclonedx-bom>=7,<8",
  "httpx>=0.28,<1",
  "pip-audit>=2.7,<3",
  "pip-licenses>=5,<6",
  "pytest>=8.3,<10",
  "twine>=6,<7",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audit_analytics = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
default-groups = ["dev"]
